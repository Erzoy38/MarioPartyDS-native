// The versions of SDL 3.4.20's own android-project: Android Gradle Plugin 8.7.3, Gradle 8.12, JDK 17.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
